<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none" role="img" aria-label="Emergency electrician van">
  <style>
    .van-body {
      transform-origin: 48px 62px;
      animation: van-drive-bounce 0.72s ease-in-out infinite;
    }

    .van-wheel {
      transform-box: fill-box;
      transform-origin: center;
      animation: van-wheel-spin 0.55s linear infinite;
    }

    .van-speed-line {
      stroke-dasharray: 16 22;
      stroke-dashoffset: 0;
      animation: van-speed-lines 0.7s linear infinite;
    }

    .van-light {
      transform-box: fill-box;
      transform-origin: center;
      animation: van-light-pulse 0.7s ease-in-out infinite;
    }

    .van-light-ray {
      animation: van-light-ray-flicker 0.7s ease-in-out infinite;
    }

    .van-light-ray--left {
      animation-delay: 0.12s;
    }

    .van-light-ray--center {
      animation-delay: 0s;
    }

    .van-light-ray--right {
      animation-delay: 0.24s;
    }

    .van-bolt {
      animation: van-bolt-flash 0.95s steps(2, end) infinite;
    }

    @keyframes van-drive-bounce {
      0%, 100% { transform: translateY(0); }
      28% { transform: translateY(1.15px); }
      58% { transform: translateY(-0.7px); }
      78% { transform: translateY(0.55px); }
    }

    @keyframes van-wheel-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes van-speed-lines {
      to { stroke-dashoffset: -38; }
    }

    @keyframes van-light-pulse {
      0%, 100% { opacity: 0.68; transform: scale(0.96); }
      50% { opacity: 1; transform: scale(1.08); }
    }

    @keyframes van-light-ray-flicker {
      0%, 100% { opacity: 0.42; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-1.2px); }
    }

    @keyframes van-bolt-flash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.62; }
    }
  </style>

  <defs>
    <radialGradient id="van-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD514" stop-opacity="0.34" />
      <stop offset="58%" stop-color="#FFD514" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#FFD514" stop-opacity="0" />
    </radialGradient>
  </defs>

  <g stroke="#FFD514" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
    <path class="van-speed-line" d="M6 63h19" opacity="0.22" />
    <path class="van-speed-line" d="M12 53h17" opacity="0.82" />
    <path class="van-speed-line" d="M16 45h11" opacity="0.72" />
  </g>

  <g class="van-body">
    <ellipse cx="50" cy="68" rx="34" ry="16" fill="url(#van-glow)" opacity="0.55" />

    <g stroke="#FFD514" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 66V48c0-8.8 7.1-15 16.5-15H64l7.5 17H83v16H18Z" fill="#090D11" />
      <path d="M64 33v33" />
      <path d="M71.5 50h11.5" />
      <path d="M27 66h18" />
      <path d="M60 66h11" />
    </g>

    <rect x="26" y="43" width="17" height="10" rx="2.4" fill="#FFD514" />

    <path class="van-bolt" d="M52 41 44.5 58H52l-5.7 18L61 53h-8.2L57 41h-5Z" fill="#FFD514" stroke="#090D11" stroke-width="1.8" stroke-linejoin="round" />

    <g class="van-wheel" stroke="#FFD514" stroke-width="3.4" stroke-linecap="round">
      <circle cx="33" cy="69" r="9.2" fill="#090D11" />
      <circle cx="33" cy="69" r="2.8" fill="#FFD514" stroke="none" />
      <path d="M33 59.8v18.4" />
      <path d="M23.8 69h18.4" />
      <path d="m26.5 62.5 13 13" />
      <path d="m39.5 62.5-13 13" />
    </g>

    <g class="van-wheel" stroke="#FFD514" stroke-width="3.4" stroke-linecap="round">
      <circle cx="70" cy="69" r="9.2" fill="#090D11" />
      <circle cx="70" cy="69" r="2.8" fill="#FFD514" stroke="none" />
      <path d="M70 59.8v18.4" />
      <path d="M60.8 69h18.4" />
      <path d="m63.5 62.5 13 13" />
      <path d="m76.5 62.5-13 13" />
    </g>

    <g class="van-light">
      <ellipse cx="56.5" cy="23.5" rx="17" ry="8" fill="#FFD514" opacity="0.13" />
      <rect x="51" y="26" width="11" height="6.5" rx="1.7" fill="#FFD514" />
    </g>

    <g stroke="#FFD514" stroke-width="4.2" stroke-linecap="round">
      <path class="van-light-ray van-light-ray--center" d="M56.5 20v-7" />
      <path class="van-light-ray van-light-ray--left" d="M48.5 21 43.5 15" opacity="0.58" />
      <path class="van-light-ray van-light-ray--right" d="M64.5 21 69.5 15" opacity="0.58" />
    </g>
  </g>
</svg>
